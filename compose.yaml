services:
  resonus:
    build: .
    image: resonus-web-release:local
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      MUSIC_SERVER_URL: "${MUSIC_SERVER_URL:?Copy .env.example to .env and set MUSIC_SERVER_URL}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
